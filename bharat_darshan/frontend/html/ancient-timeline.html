{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ancient Timeline</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=EB+Garamond&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/ancienttimeline.css' %}">

</head>

<body>

<div class="wrapper">

  <!-- LEFT INFO -->
  <div class="info">
    <h1 id="dynasty">Maurya Empire</h1>
    <h3 id="period">321–185 BCE</h3>
    <p id="desc">
      Major political power of ancient India that established centralized administration and imperial unity.
    </p>
  </div>

  <!-- RIGHT CIRCLE -->
  <div class="circle-area">
    <div class="circle-wrapper">
       <div class="circle-message">
          Click a point to explore dynasty
      </div>
      <div class="circle" id="circle">

       

        
        <!-- ALL DYNASTIES -->
        <div class="era" data-name="Gauda Kingdom"></div>
        <div class="era" data-name="Gupta Empire"></div>
        <div class="era" data-name="Gurjara–Pratihara"></div>
        <div class="era" data-name="Harsha Empire"></div>
        <div class="era" data-name="Huna Kingdom"></div>
        <div class="era" data-name="Indo-Greek Kingdom"></div>
        <div class="era" data-name="Indo-Parthians"></div>
        <div class="era" data-name="Kanva Dynasty"></div>
        <div class="era" data-name="Kushan Empire"></div>
        <div class="era" data-name="Maurya Empire"></div>
        <div class="era" data-name="Mukharis"></div>
        <div class="era" data-name="Maitraka Dynasty"></div>
        <div class="era" data-name="Nanda Empire"></div>
        <div class="era" data-name="Pala Empire"></div>
        <div class="era" data-name="Saka Kingdom"></div>
        <div class="era" data-name="Satavahana Dynasty"></div>
        <div class="era" data-name="Shunga Empire"></div>
        <div class="era" data-name="Vakataka Dynasty"></div>
        <div class="era" data-name="Southern Kingdoms"></div>
        <div class="era" data-name="Western Kshatrapas"></div>

      </div>
      <div class="center-label">
        <h2>Ancient India</h2>
        </div>
    </div>
  </div>

</div>

<script src="{% static 'js/at.js' %}"></script>

</body>
</html>
