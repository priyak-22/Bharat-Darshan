{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ancient Indian Dynasties | Cultural Heritage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Playfair+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="{% static 'css/ancientculture.css' %}">
</head>

<body>

<header>
  <h1>Cultural Heritage of Ancient Indian Dynasties</h1>
  <p>Tangible and Intangible traditions across early Indian history</p>
</header>

<div class="container">
  <div class="card-wrapper">

    <button class="nav-btn" onclick="prevDynasty()">
      <i class="fas fa-chevron-left"></i>
    </button>

    <div class="card">
      <h2 id="dynastyName"></h2>
      <p id="dynastyPeriod"></p>

      <div class="section-buttons">
        <div class="section-btn" onclick="show('tangible')">
          <i class="fas fa-landmark"></i>
          <h4>Tangible Culture</h4>
        </div>
        <div class="section-btn" onclick="show('intangible')">
          <i class="fas fa-om"></i>
          <h4>Intangible Culture</h4>
        </div>
      </div>

      <div class="content-box" id="tangible"></div>
      <div class="content-box" id="intangible"></div>

      <div class="why-box">
        <h3>Why it matters</h3>
        <p id="why"></p>
      </div>
    </div>

    <button class="nav-btn" onclick="nextDynasty()">
      <i class="fas fa-chevron-right"></i>
    </button>

  </div>
</div>

<footer>
  © Digital Atlas of India | Ancient Dynasties Module
</footer>

<!-- JavaScript -->
<script src="{% static 'js/ac.js' %}"></script>

</body>
</html>
