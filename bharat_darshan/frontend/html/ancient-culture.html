<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cultural Heritage | Digital Atlas of India</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Playfair+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin: 0;
  background: #f4ecd8; /* light parchment color */
  color: #2b1a0f; /* dark brown for text */
  font-family: 'Playfair Display', serif;
}

header {
  text-align: center;
  padding: 50px 20px;
  background: 
    linear-gradient(to bottom, rgba(241, 224, 177, 0.95), rgba(180, 145, 80, 0.9)),
    url("https://images.unsplash.com/photo-1609943246327-6e4c5f6d7a0c") center/cover;
  border-bottom: 4px double #b28a3b;
  box-shadow: inset 0 0 50px rgba(0,0,0,0.3);
  position: relative;
}

header h1 {
  font-family: 'Cinzel', serif;
  font-size: 38px;
  color: #593e1a;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.6), 0 0 8px rgba(194, 144, 60, 0.5);
}

header p {
  font-family: 'Playfair Display', serif;
  color: #3f2e1b;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  font-size: 18px;
}


.container {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
}

.card-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.nav-btn {
  background: none;
  border: 1px solid #8b6d3b;
  color: #8b6d3b;
  font-size: 22px;
  padding: 10px 14px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.nav-btn:hover {
  background: #d8c3a5;
  color: #3d2b1f;
  border-color: #3d2b1f;
}

.card {
  max-width: 760px;
  width: 100%;
  background: #f0e6d2; /* parchment texture feel */
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  border: 2px solid #b4996c;
}

.section-buttons {
  display: flex;
  gap: 20px;
  margin-top: 25px;
}

.section-btn {
  flex: 1;
  border: 1px solid #b4996c;
  padding: 18px;
  cursor: pointer;
  text-align: center;
  background: #e6d7b3;
  transition: all 0.2s ease;
}

.section-btn:hover {
  background: #d4b788;
  color: #2b1a0f;
}

.section-btn i {
  font-size: 26px;
  color: #8b6d3b;
}

.content-box {
  display: none;
  margin-top: 25px;
  padding: 20px;
  background: #f6f0e1;
  border-left: 4px solid #b4996c;
  border-radius: 5px;
}

.heritage-item {
  margin-bottom: 25px;
}

.heritage-img {
  width: 100%;
  max-height: 240px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  border: 3px solid #b4996c;
  transition: transform 0.2s ease;
}

.heritage-img:hover {
  transform: scale(1.03);
  border-color: #8b6d3b;
}

.why-box {
  margin-top: 30px;
  padding: 20px;
  border: 1px dashed #b4996c;
  background: #f0e6d2;
  border-radius: 6px;
  color: #3d2b1f;
}

footer {
  text-align: center;
  padding: 20px;
  opacity: 0.8;
  font-style: italic;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.modal-content {
  background: #f4ecd8;
  padding: 25px;
  max-width: 600px;
  border-radius: 12px;
  border: 2px solid #b4996c;
  color: #2b1a0f;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.close-btn {
  float: right;
  cursor: pointer;
  color: #8b6d3b;
  font-size: 22px;
  font-weight: bold;
}

</style>
</head>

<body>

<header>
  <h1>Cultural Heritage of Ancient Indian Dynasties</h1>
  <p>Tangible and Intangible Traditions </p>
</header>

<div class="container">
  <div class="card-wrapper">
    <button class="nav-btn" onclick="prevDynasty()">
      <i class="fas fa-chevron-left"></i>
    </button>

    <div class="card">
      <h2 id="dynastyName"></h2>
      <p id="dynastyPeriod"></p>

      <div class="section-buttons">
        <div class="section-btn" onclick="show('tangible')">
          <i class="fas fa-landmark"></i>
          <h4>Tangible Culture</h4>
        </div>
        <div class="section-btn" onclick="show('intangible')">
          <i class="fas fa-om"></i>
          <h4>Intangible Culture</h4>
        </div>
      </div>

      <div class="content-box" id="tangible"></div>
      <div class="content-box" id="intangible"></div>

      <div class="why-box">
        <h3>Why it matters</h3>
        <p id="why"></p>
      </div>
    </div>

    <button class="nav-btn" onclick="nextDynasty()">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>
</div>

<footer>
  © Digital Atlas of India
</footer>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">✖</span>
    <p id="modalText"></p>
  </div>
</div>

<script>

  // Ancient Dynasties
  {

      { img: "https://upload.wikimedia.org/wikipedia/commons/4/44/Pataliputra_ruins.jpg", short: "Fortified cities like Pataliputra.", more: "Pataliputra was heavily fortified and served as the political and administrative capital." }
    ],
    intangible: [
      { img: "https://upload.wikimedia.org/wikipedia/commons/6/6a/Ancient_Indian_Administration.jpg", short: "Centralized administration.", more: "The Nandas established a strong centralized bureaucracy controlling provinces." },
      { img: "https://upload.wikimedia.org/wikipedia/commons/3/34/Ancient_Indian_Taxation.jpg", short: "Efficient taxation system.", more: "Revenue was collected systematically from agriculture, trade, and crafts." }
    ],
    why: "They laid the administrative and economic foundation for the Mauryan Empire."
  },

  // Medieval Dynasties
  {
    name: "Pala Dynasty",

    intangible: [{ img: "images/tantric_buddhism.jpg", short: "Growth of Tantric Buddhism.", more: "The Pala rulers patronized Buddhist traditions including Tantric practices." }],
    why: "Education and Buddhism flourished under Pala rule."
  },
  {
    name: "Rashtrakuta Dynasty",
    period: "8th–10th CE",
    tangible: [{ img: "images/ellora.jpg", short: "Ellora caves architecture.", more: "Rashtrakutas built magnificent rock-cut temples at Ellora." }],
    intangible: [{ img: "images/poetry.jpg", short: "Kannada literature.", more: "Promoted literature in local languages including Kannada and Sanskrit." }],
    why: "Flourished in art, architecture, and literature."
  },
  {
    name: "Gurjara-Pratihara",
    period: "8th–11th CE",

    intangible: [{ img: "images/rajput_valor.jpg", short: "Rajput valor and culture.", more: "Emphasized honor, bravery, and loyalty." }],

  {

  },
  {

    intangible: [{ img: "images/ghazni_raids.jpg", short: "Islamic expansion.", more: "Cultural and religious impacts through raids." }],

    why: "Foundation for Delhi Sultanate."
  },
  {

  {

  {

  },
  {

    intangible: [{ img: "images/bijapur_culture.jpg", short: "Persian influenced art and culture.", more: "Flourished in arts, literature, and architecture." }],
    why: "Prominent Deccan Sultanate."
  },
  {
    name: "Barid Shahid of Bidar",
    period: "1489–1619 CE",
    tangible: [{ img: "images/barid_fort.jpg", short: "Fortifications.", more: "Defensive architecture in Bidar region." }],
    intangible: [{ img: "images/barid_culture.jpg", short: "Administration and local governance.", more: "Maintained regional control." }],
    why: "Minor Deccan Sultanate contributing to regional culture."
  },
  {
    name: "Nizam Shahi of Ahmadnagar",
    period: "1490–1636 CE",
    tangible: [{ img: "images/ahmadnagar_fort.jpg", short: "Ahmadnagar Fort.", more: "Strong fortifications and palaces." }],

    why: "Important Deccan Sultanate."
  },
  {
    name: "Qutb Shahi of Golconda",

  },

    intangible: [{ img: "images/maratha_culture.jpg", short: "Guerrilla warfare and administration.", more: "Developed a unique military and administrative system." }],

  {

    period: "15th–17th CE",

  {

    period: "15th–18th CE",

let i = 0;

function load() {
  const d = dynasties[i];
  dynastyName.innerText = d.name;
  dynastyPeriod.innerText = d.period;
  why.innerText = d.why;

  renderSection("tangible", d.tangible);
  renderSection("intangible", d.intangible);
}

function renderSection(id, items) {
  const box = document.getElementById(id);
  box.innerHTML = "";

  items.forEach(item => {
    box.innerHTML += `
      <div class="heritage-item">
        <img src="${item.img}" class="heritage-img" onclick="openModal('${item.more}')">
        <p>${item.short}</p>
      </div>
    `;
  });
}

function show(id) {
  tangible.style.display = "none";
  intangible.style.display = "none";
  document.getElementById(id).style.display = "block";
}

function nextDynasty() {
  i = (i + 1) % dynasties.length;
  load();
}

function prevDynasty() {
  i = (i - 1 + dynasties.length) % dynasties.length;
  load();
}

function openModal(text) {
  modal.style.display = "flex";
  modalText.innerText = text;
}

function closeModal() {
  modal.style.display = "none";
}

load();
</script>

</body>
</html>
