<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Medieval Indian Dynasties | Cultural Heritage</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Playfair+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin: 0;
   background: url('') no-repeat center center fixed;
  color: #f4f4f4;
  font-family: 'Playfair Display', serif;
}

header {
  text-align: center;
  padding: 40px 20px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.85), #111),
  url("https://images.unsplash.com/photo-1609943246327-6e4c5f6d7a0c") center/cover;
}

header h1 {
  font-family: 'Cinzel', serif;
  font-size: 36px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
}

.card-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.nav-btn {
  background: none;
  border: 1px solid #c9a14a;
  color: #c9a14a;
  font-size: 22px;
  padding: 10px 14px;
  cursor: pointer;
}

.card {
  max-width: 750px;
  width: 100%;
  background: #1e1e1e;
  padding: 30px;
  border-radius: 10px;
  animation: fade 0.4s ease;
}

@keyframes fade {
  from {opacity: 0; transform: translateY(8px);}
  to {opacity: 1; transform: translateY(0);}
}

.section-buttons {
  display: flex;
  gap: 20px;
  margin-top: 25px;
}

.section-btn {
  flex: 1;
  border: 1px solid #c9a14a;
  padding: 18px;
  cursor: pointer;
  text-align: center;
  transition: 0.3s;
}

.section-btn:hover {
  background: #2a2a2a;
}

.section-btn i {
  font-size: 26px;
  color: #c9a14a;
}

.content-box {
  display: none;
  margin-top: 25px;
  padding: 20px;
  background: #181818;
  border-left: 4px solid #c9a14a;
}

.why-box {
  margin-top: 35px;
  padding: 20px;
  border: 1px dashed #c9a14a;
  background: #1b1b1b;
}

footer {
  text-align: center;
  padding: 20px;
  opacity: 0.7;
}
</style>
</head>

<body>

<header>
  <h1>Cultural Heritage of Medieval Indian Dynasties</h1>
  <p>Tangible and Intangible traditions across medieval India</p>
</header>

<div class="container">
  <div class="card-wrapper">
    <button class="nav-btn" onclick="prevDynasty()"><i class="fas fa-chevron-left"></i></button>

    <div class="card">
      <h2 id="dynastyName"></h2>
      <p id="dynastyPeriod"></p>

      <div class="section-buttons">
        <div class="section-btn" onclick="show('tangible')">
          <i class="fas fa-landmark"></i>
          <h4>Tangible Culture</h4>
        </div>
        <div class="section-btn" onclick="show('intangible')">
          <i class="fas fa-om"></i>
          <h4>Intangible Culture</h4>
        </div>
      </div>

      <div class="content-box" id="tangible"></div>
      <div class="content-box" id="intangible"></div>

      <div class="why-box">
        <h3>Why it matters</h3>
        <p id="why"></p>
      </div>
    </div>

    <button class="nav-btn" onclick="nextDynasty()"><i class="fas fa-chevron-right"></i></button>
  </div>
</div>

<footer>
  © Digital Atlas of India | Medieval Dynasties Module
</footer>

<script>
const dynasties = [
  { name:"Mewar Kingdom", period:"7th–18th CE", 
    tangible:"Fortresses like Chittorgarh and Kumbhalgarh, royal palaces, temples.",
    intangible:"Legend of Rajput valor, resistance to invaders, codes of honor.",
    why:"Symbol of bravery and resilience in North Indian history." },

  { name:"Pala Dynasty", period:"8th–12th CE", 
    tangible:"Nalanda University, monasteries, Buddhist sculptures.",
    intangible:"Promotion of Mahayana Buddhism, scholarship and arts.",
    why:"Significant patrons of Buddhism and learning in eastern India." },

  { name:"Rashtrakuta Dynasty", period:"8th–10th CE", 
    tangible:"Kailasa temple at Ellora, coinage, inscriptions.",
    intangible:"Administrative innovations and military prowess.",
    why:"Major Deccan power influencing art, architecture, and politics." },

  { name:"Gurjara-Pratihara", period:"8th–11th CE", 
    tangible:"Fortifications, temples, coins.",
    intangible:"Defended India from Arab invasions, strong administration.",
    why:"Crucial in preserving Indian culture against foreign invasions." },

  { name:"Chola Dynasty", period:"9th–13th CE", 
    tangible:"Grand temples like Brihadeshwara, naval fleets, bronze sculptures.",
    intangible:"Maritime trade culture, temple rituals, Tamil literature.",
    why:"Expanded South Indian culture across Southeast Asia." },

  { name:"Chandel/Chauhan", period:"10th–12th CE", 
    tangible:"Khajuraho temples, forts.",
    intangible:"Rajput valor, local governance, patronage of arts.",
    why:"Notable for architecture and military achievements." },

  { name:"Rajput Kingdoms", period:"10th–16th CE", 
    tangible:"Palaces, forts, and temples across Rajasthan and north-central India.",
    intangible:"Warrior ethos, alliances, and courtly culture.",
    why:"Defined medieval North Indian political and cultural landscape." },

  { name:"Mahmud of Ghazni", period:"11th CE", 
    tangible:"Looted temples, fortresses.",
    intangible:"Spread of fear and Persian cultural influence.",
    why:"Marked the start of repeated invasions from Central Asia." },

  { name:"Ghurid Dynasty", period:"12th CE", 
    tangible:"Qutb Minar, forts.",
    intangible:"Introduction of organized Muslim rule in northern India.",
    why:"Foundation for Delhi Sultanate and Islamic influence." },

  { name:"Kakatiya & Hoysala", period:"12th–14th CE", 
    tangible:"Warangal Fort, Chennakesava temples, inscriptions.",
    intangible:"Promotion of Telugu and Kannada literature, art, and administration.",
    why:"Important South Indian dynasties influencing architecture and culture." },

  { name:"Delhi Sultanate", period:"1206–1526 CE", 
    tangible:"Qutb Minar, Alai Darwaza, mosques and forts.",
    intangible:"Spread of Islam, administrative reforms, cultural fusion.",
    why:"Established Islamic governance and new cultural traditions in India." },

  { name:"Khilji Dynasty", period:"1290–1320 CE", 
    tangible:"Forts and market structures.",
    intangible:"Expansionist policies, economic reforms, strong army.",
    why:"Extended Delhi Sultanate influence to South India." },

  { name:"Tughlaq Dynasty", period:"1320–1414 CE", 
    tangible:"Firoz Shah Kotla, city planning.",
    intangible:"Ambitious revenue and administrative reforms.",
    why:"Attempted centralized governance and infrastructural growth." },

  { name:"Bahmani Sultanate", period:"1347–1527 CE", 
    tangible:"Bidar and Gulbarga forts, mosques.",
    intangible:"Promoted Deccan culture, Persian art, and administration.",
    why:"Important Deccan power fostering regional culture." },

  { name:"Vijayanagar Empire", period:"14th–17th CE", 
    tangible:"Hampi ruins, temples, irrigation systems.",
    intangible:"Promotion of Hindu culture, literature, and trade.",
    why:"Major South Indian empire preserving culture under threat of invasions." },

  { name:"Sayyid Dynasty", period:"1414–1451 CE", 
    tangible:"Fortifications and coins.",
    intangible:"Continued Delhi Sultanate administration.",
    why:"Maintained political stability during a transitional period." },

  { name:"Lodi Dynasty", period:"1451–1526 CE", 
    tangible:"Tombs, forts, and city planning in Delhi.",
    intangible:"Pashtun cultural influences, central administration.",
    why:"Last dynasty of Delhi Sultanate before Mughal rule." },

  { name:"Bijapur Sultanate", period:"1489–1686 CE", 
    tangible:"Gol Gumbaz, mosques, palaces.",
    intangible:"Persianate culture, Deccan administration.",
    why:"Prominent Deccan Sultanate influencing art and architecture." },

  { name:"Barid Shahis of Bidar", period:"1489–1619 CE", 
    tangible:"Bidar Fort, palaces.",
    intangible:"Local governance, cultural patronage.",
    why:"Part of Deccan Sultanates consolidating regional power." },

  { name:"Nizam Shahi of Ahmadnagar", period:"1490–1636 CE", 
    tangible:"Fortresses and mosques.",
    intangible:"Deccan administration and military campaigns.",
    why:"Resisted Mughal expansion and contributed to Deccan politics." },

  { name:"Qutb Shahi of Golconda", period:"1518–1687 CE", 
    tangible:"Golconda Fort, Charminar.",
    intangible:"Persian-Telugu cultural fusion, diamond trade.",
    why:"Founded Hyderabad and influenced Deccan culture." },

  { name:"Mughal Empire", period:"1526–1857 CE", 
    tangible:"Taj Mahal, Red Fort, mosques, forts.",
    intangible:"Persian-influenced art, architecture, administration, literature.",
    why:"One of the largest empires in India shaping modern history." },

  { name:"Sher Shah Suri", period:"1540–1545 CE", 
    tangible:"Rohtas Fort, roads (Grand Trunk Road).",
    intangible:"Efficient administration and land revenue system.",
    why:"Introduced reforms still influential in India." },

  { name:"Talikota Kingdoms", period:"1565 CE", 
    tangible:"Battlefields, ruined cities.",
    intangible:"Shift in Deccan power dynamics.",
    why:"Defeat of Vijayanagar marked major political change in South India." },

  { name:"Bhakti Movement", period:"14th–17th CE", 
    tangible:"Temples, devotional manuscripts.",
    intangible:"Spread of devotion, vernacular literature, spiritual reform.",
    why:"Shaped social and religious thought in medieval India." },

  { name:"Sikh Gurus", period:"15th–18th CE", 
    tangible:"Gurdwaras, manuscripts.",
    intangible:"Teachings of Sikhism, community institutions.",
    why:"Provided spiritual and social framework influencing Punjab." },

  { name:"End of Medieval Period", period:"16th CE onwards", 
    tangible:"Transition in forts, architecture.",
    intangible:"Shift from medieval governance to early modern structures.",
    why:"Marks transition to modern Indian political era." },

  { name:"Marathas", period:"17th–19th CE", 
    tangible:"Fortresses, palaces, temples.",
    intangible:"Military organization, administration, regional influence.",
    why:"Important power in India resisting Mughals and influencing Maratha Confederacy." }
];

let i = 0;

function load() {
  document.getElementById("dynastyName").innerText = dynasties[i].name;
  document.getElementById("dynastyPeriod").innerText = dynasties[i].period;
  document.getElementById("tangible").innerText = dynasties[i].tangible;
  document.getElementById("intangible").innerText = dynasties[i].intangible;
  document.getElementById("why").innerText = dynasties[i].why;
}

function nextDynasty() {
  i = (i + 1) % dynasties.length;
  hide();
  load();
}

function prevDynasty() {
  i = (i - 1 + dynasties.length) % dynasties.length;
  hide();
  load();
}

function show(id) {
  hide();
  document.getElementById(id).style.display = "block";
}

function hide() {
  document.getElementById("tangible").style.display = "none";
  document.getElementById("intangible").style.display = "none";
}

load();
</script>

</body>
</html>
