<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bharat Darshan | Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/login.css' %}">

  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <h1>Create Account</h1>
      <p class="subtitle">Join Bharat Darshan</p>

      <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Create password" required>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" placeholder="Confirm password" required>

        <button type="submit">Create Account</button>

        {% if error %}
          <p style="color:#8b0000; margin-top:10px;">{{ error }}</p>
        {% endif %}
      </form>

      <p class="note">
        Already registered?
        <a href="{% url 'login' %}" style="color:#8b0000; font-weight:600; text-decoration:none;">
          Login here
        </a>
      </p>
    </div>
  </div>

</body>
</html>
