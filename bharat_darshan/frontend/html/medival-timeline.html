{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Medieval Indian Circular Timeline</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=EB+Garamond&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/medivaltimeline.css' %}">

</head>

<body>

<div class="wrapper">

  <!-- LEFT INFO -->
  <div class="info">
    <h1 id="dynasty">Pala Dynasty</h1>
    <h3 id="period">750–1174 CE</h3>
    <p id="desc">
      Major medieval Indian dynasties that influenced politics, culture, and architecture.
    </p>
  </div>

  <!-- RIGHT CIRCLE -->
  <div class="circle-area">
    <div class="circle-wrapper">
       <div class="circle-message">
          Click a dynasty to explore
      </div>
      <div class="circle" id="circle">

        <!-- MEDIEVAL DYNASTIES FROM PATHS -->
        <div class="era" data-name="Pala Dynasty"></div>
        <div class="era" data-name="Rashtrakuta Dynasty"></div>
        <div class="era" data-name="Gurjara-Pratihara"></div>
        <div class="era" data-name="Chola Dynasty"></div>
        <div class="era" data-name="Chandela-Chauhan"></div>
        <div class="era" data-name="Rajput Kingdoms"></div>
        <div class="era" data-name="Delhi Sultanate"></div>
        <div class="era" data-name="Mewar Kingdom"></div>
        <div class="era" data-name="Vijayanagar Empire"></div>
        <div class="era" data-name="Bahmani Sultanate"></div>
        <div class="era" data-name="Kakatiya-Hoysala"></div>
        <div class="era" data-name="End of Medieval Era"></div>

      </div>
      <div class="center-label">
        <h2>Medieval India</h2>
      </div>
    </div>
  </div>

</div>

<script src="{%static 'js/met.js' %}"></script>

</body>
</html>
