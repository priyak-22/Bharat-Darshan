{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modern Indian History | Cultural Heritage</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Playfair+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/modernculture.css' %}">
</head>

<body>

<header>
  <h1>Modern Indian History</h1>
  <p>Key events, movements, and colonial interactions in modern India</p>
</header>

<div class="container">
  <div class="card-wrapper">
    <button class="nav-btn" onclick="prevEvent()">
      <i class="fas fa-chevron-left"></i>
    </button>

    <div class="card">
      <h2 id="eventName"></h2>
      <p id="eventPeriod"></p>

      <div class="section-buttons">
        <div class="section-btn" onclick="showSection('tangible')">
          <i class="fas fa-landmark"></i>
          <h4>Tangible</h4>
        </div>
        <div class="section-btn" onclick="showSection('intangible')">
          <i class="fas fa-om"></i>
          <h4>Intangible</h4>
        </div>
      </div>

      <div class="content-box" id="tangible"></div>
      <div class="content-box" id="intangible"></div>

      <div class="why-box">
        <h3>Why it matters</h3>
        <p id="why"></p>
      </div>
    </div>

    <button class="nav-btn" onclick="nextEvent()">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>
</div>

<footer>
  © Digital Atlas of India | Modern History Module
</footer>

<script>
  const eventUrls = {
    portugese: "{% url 'portugese' %}",
    dutch: "{% url 'dutch' %}",
    danes: "{% url 'danes' %}",
    french: "{% url 'french' %}",
    anglo_french: "{% url 'anglo_french' %}",
    plassey: "{% url 'plassey' %}",
    buxar: "{% url 'buxar' %}",
    british: "{% url 'british' %}",
    mughal_decline: "{% url 'mughal_decline' %}",
    bengal_swadeshi: "{% url 'bengal_swadeshi' %}",
    indian_nc: "{% url 'indian_nc' %}",
    non_cooperation: "{% url 'non_cooperation' %}",
    civil_disobidience: "{% url 'civil_disobidience' %}",
    home_rule: "{% url 'home_rule' %}",
    jallianwala_bagh: "{% url 'jallianwala_bagh' %}",
    quit_india_movement: "{% url 'quit_india_movement' %}",
    india_independence: "{% url 'india_independence' %}"
  };
</script>

<script src="{% static 'js/moc.js' %}"></script>
</body>
</html>
