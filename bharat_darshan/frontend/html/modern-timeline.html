<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modern Indian Circular Timeline</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=EB+Garamond&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  background: linear-gradient(90deg,#efe4cf 35%,#e5cfaa 65%);
  font-family:'EB Garamond', serif;
  color:#4a2d12;
  overflow:hidden;
}

.wrapper{
  display:flex;
  height:100%;
}

/* LEFT PANEL */
.info{
  width:35%;
  padding:70px 50px;
  border-right:5px solid #8a5a2b;
}

.info h1{
  font-family:'Cinzel', serif;
  font-size:32px;
  margin-bottom:12px;
}

.info h3{
  font-size:18px;
  margin-bottom:20px;
}

.info p{
  font-size:17px;
  line-height:1.6;
}

/* RIGHT SIDE */
.circle-area{
  width:65%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.circle-wrapper{
  width:min(68vh,68vw);
  height:min(68vh,68vw);
  position:relative;
}

.circle{
  width:100%;
  height:100%;
  border-radius:50%;
  border:3px dashed #8a5a2b;
  background:#f3e6cf;
  position:relative;
  transition:transform 0.8s ease;
}

.center-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
}

.center-label h2 {
  margin: 0;
  font-size: 22px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #6a4a2b;
}

.circle-message {
  position: absolute;
  top: -60px;
  width: 100%;
  text-align: center;
  font-family: 'Cinzel', serif;
  font-size: 18px;
  color: #6a4a2b;
  letter-spacing: 1px;
}

/* DYNASTY CIRCLES */
.era{
  position:absolute;
  width:36px;
  height:36px;
  border-radius:50%;
  background:#f0e0c2;
  border:3px solid #8a5a2b;
  transform:translate(-50%,-50%);
  cursor:pointer;
  box-shadow:0 4px 8px rgba(0,0,0,0.3);
  transition:0.3s;
}

.era:hover{
  transform:translate(-50%,-50%) scale(1.15);
}

.era.active{
  border-color:#c79a3a;
  box-shadow:0 0 14px rgba(199,154,58,0.9);
}

/* RESPONSIVE */
@media(max-width:900px){
  .wrapper{
    flex-direction:column;
  }
  .info{
    width:100%;
    border-right:none;
    border-bottom:5px solid #8a5a2b;
    padding:40px;
  }
  .circle-area{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <!-- LEFT INFO -->
  <div class="info">
    <h1 id="dynasty">Anglo-French Conflicts</h1>
    <h3 id="period">1600–1947 CE</h3>
    <p id="desc">
      Major modern events and movements in India leading to independence.
    </p>
  </div>

  <!-- RIGHT CIRCLE -->
  <div class="circle-area">
    <div class="circle-wrapper">
       <div class="circle-message">
          Click a point to explore
      </div>
      <div class="circle" id="circle">

        <!-- MODERN DYNASTIES / EVENTS FROM PATHS -->
        <div class="era" data-name="Anglo-French Conflicts"></div>
        <div class="era" data-name="Bengal Swadeshi Movement"></div>
        <div class="era" data-name="British Expansion"></div>
        <div class="era" data-name="Battle of Buxar"></div>
        <div class="era" data-name="Civil Disobedience Movement"></div>
        <div class="era" data-name="Danes in India"></div>
        <div class="era" data-name="Dutch in India"></div>
        <div class="era" data-name="French in India"></div>
        <div class="era" data-name="Home Rule Movement"></div>
        <div class="era" data-name="India Independence"></div>
        <div class="era" data-name="Indian National Congress"></div>
        <div class="era" data-name="Jallianwala Bagh"></div>
        <div class="era" data-name="Mughal Decline"></div>
        <div class="era" data-name="Non-Cooperation Movement"></div>
        <div class="era" data-name="Battle of Plassey"></div>
        <div class="era" data-name="Portuguese in India"></div>
        <div class="era" data-name="Quit India Movement"></div>
        <div class="era" data-name="Revolt of 1857"></div>
        <div class="era" data-name="Social & Religious Movements"></div>

      </div>
      <div class="center-label">
        <h2>Modern India</h2>
      </div>
    </div>
  </div>

</div>

<script>
const eras = document.querySelectorAll('.era');
const circle = document.getElementById('circle');
const dynasty = document.getElementById('dynasty');

function positionEras(){
  const size = circle.offsetWidth;
  const center = size / 2;
  const radius = center - 40;
  const total = eras.length;

  eras.forEach((era,i)=>{
    const angle = (i/total) * 2 * Math.PI - Math.PI/2;
    era.style.left = center + radius * Math.cos(angle) + "px";
    era.style.top  = center + radius * Math.sin(angle) + "px";

    era.onclick = ()=>{
      eras.forEach(e=>e.classList.remove("active"));
      era.classList.add("active");
      dynasty.textContent = era.dataset.name;
      circle.style.transform = `rotate(${-i*(360/total)}deg)`;
    };
  });
}

window.onload = positionEras;
window.onresize = positionEras;
</script>

</body>
</html>
