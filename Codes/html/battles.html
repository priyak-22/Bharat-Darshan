<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Battles & Events | Digital History Atlas of India</title>
  <link rel="stylesheet" href="../css/battles.css" />
  <link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>
</head>
<body>
  <header class="page-header">
    <div class="header-image-container">
      <img src="https://img.freepik.com/premium-photo/kurukshetra-war-depicting-epic-battlefield-with-stirring-scenes-triumph-tragedy_1163744-478.jpg?w=740" alt="Historical Header">
    </div>
    <h1>Battles & Events in Indian History</h1>
    <p class="subheading">Discover the key battles, invasions, revolts and turning points that shaped India’s destiny.</p>
  </header>

  <nav>
    <div class="nav-left">
      <div class="brand">Bharat Darshan</div>
      <div class="nav-links">
        <a href="atlas.html">Home</a>
        <a href="#">Ancient India</a>
        <a href="#">Medieval India</a>
        <a href="#">Modern India</a>
        <a href="#">About</a>
      </div>

      <div class="search-box">
        <input type="text" placeholder="Search...">
        <button>🔍</button>
      </div>
    </div>

    <button class="login-btn" onclick="window.location.href='login.html'">Login</button>
  </nav>

<main class="map-layout">

    <div class="map-wrapper">

        <!-- Map -->
        <div id="map"></div>

        <!-- Info Panel -->
        <aside class="info-panel" id="infoPanel" aria-hidden="true">
            <button class="close-panel" id="closePanel">✕</button>
            <div class="info-content">
    <h2 id="battleTitle">Select a marker</h2>
    <p id="battleYear"></p>
    <p id="battleRegion"></p>
    <p id="battleSummary"></p>

    <a id="learnMoreBtn" class="learn-more" href="#" target="_blank" rel="noopener">
      Learn More →
    </a>
</div>

        </aside>

    </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</html>
