<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern India Horizontal Timeline</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #f5f0e5;
}

.header {
  text-align: center;
  font-size: 32px;
  font-weight: bold;
  color: #4b341f;
  padding: 25px 0 10px;
}

.timeline-line {
  height: 4px;
  background: #6b4f2f;
  margin: 0 20px 25px;
  border-radius: 2px;
}

.timeline-container {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 180px;
  gap: 25px;
  padding: 20px;
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: #b5966d #f5f0e5;
}

.timeline-container::-webkit-scrollbar {
  height: 10px;
}
.timeline-container::-webkit-scrollbar-track {
  background: #f5f0e5;
}
.timeline-container::-webkit-scrollbar-thumb {
  background: #b5966d;
  border-radius: 5px;
}

.card {
  width: 120px;
  height: 120px;
  background: #fff8e6;
  border: 3px solid #b5966d;
  border-radius: 50%;
  text-align: center;
  cursor: pointer;
  position: relative;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  transition: transform 0.2s;
}

.card:hover {
  transform: scale(1.05);
}

.card strong {
  font-size: 18px;
  color: #4b341f;
}

.bottom-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 25px;
  padding: 30px;
}

.section-box {
  background: #fff8e6;
  border: 2px solid #b5966d;
  border-radius: 12px;
  padding: 20px;
  min-height: 350px;
  box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);
}

.section-box h2 {
  margin-top: 0;
  color: #4b341f;
  font-size: 24px;
}

.section-box img {
  width: 100%;
  border-radius: 8px;
  margin-top: 10px;
  opacity: 0;
  transition: opacity 0.5s ease-in-out;
}

.section-box img.visible {
  opacity: 1;
}
</style>
</head>

<body>

<div class="header">Modern India Timeline</div>
<div class="timeline-line"></div>

<div class="timeline-container" id="timeline"></div>

<div class="bottom-section">
  <div class="section-box" id="mapRegion">
    <h2>Map/Region</h2>
    <p>Select an event to view its region or influence area.</p>
  </div>

  <div class="section-box" id="infoRegion">
    <h2>Information</h2>
    <p>Select an event to see details.</p>
  </div>
</div>

<script>
// Modern India events timeline
const events = [
  {name:"Social & Religious Reform Movements", years:"1818 – 1900", founder:"Raja Ram Mohan Roy, Swami Vivekananda", leaders:"Raja Ram Mohan Roy, Ishwar Chandra Vidyasagar", end:"Became basis for Indian socio-reform and awakening", info:"Movements to reform Indian society and religion.", region:"All over India", img:"https://via.placeholder.com/400x250?text=Reforms"},
  {name:"Revolt of 1857", years:"1857", founder:"Mangal Pandey", leaders:"Rani Laxmibai, Bahadur Shah Zafar", end:"Suppressed by British", info:"First major revolt against British East India Company.", region:"North & Central India", img:"https://via.placeholder.com/400x250?text=1857+Revolt"},
  {name:"Indian National Congress Formation", years:"1885", founder:"A.O. Hume", leaders:"Dadabhai Naoroji, Gopal Krishna Gokhale", end:"Became main political platform for independence", info:"Formation of political party for Indian interests.", region:"Pan India", img:"https://via.placeholder.com/400x250?text=INC+Formation"},
  {name:"Partition of Bengal & Swadeshi Movement", years:"1905 – 1911", founder:"Surendranath Banerjee", leaders:"Bal Gangadhar Tilak, Bipin Chandra Pal", end:"Partition annulled in 1911", info:"Protest against British policy, encouraged indigenous goods.", region:"Bengal", img:"https://via.placeholder.com/400x250?text=Partition+of+Bengal"},
  {name:"Home Rule Movement", years:"1916 – 1918", founder:"Bal Gangadhar Tilak, Annie Besant", leaders:"Tilak, Besant", end:"Merged with wider national movement", info:"Demanded self-government for India.", region:"All India", img:"https://via.placeholder.com/400x250?text=Home+Rule"},
  {name:"Jallianwala Bagh Massacre", years:"1919", founder:"-", leaders:"General Dyer", end:"Triggered nationwide outrage", info:"Massacre of unarmed civilians in Amritsar.", region:"Amritsar, Punjab", img:"https://via.placeholder.com/400x250?text=Jallianwala+Bagh"},
  {name:"Non-Cooperation Movement", years:"1920 – 1922", founder:"Mahatma Gandhi", leaders:"Jawaharlal Nehru, Sardar Patel", end:"Called off after Chauri Chaura incident", info:"Mass civil disobedience against British rule.", region:"All India", img:"https://via.placeholder.com/400x250?text=Non+Cooperation"},
  {name:"Civil Disobedience Movement", years:"1930 – 1934", founder:"Mahatma Gandhi", leaders:"Jawaharlal Nehru, Subhas Chandra Bose", end:"Suppressed by British", info:"Protests against salt tax and colonial laws.", region:"All India", img:"https://via.placeholder.com/400x250?text=Civil+Disobedience"},
  {name:"Quit India Movement", years:"1942", founder:"Mahatma Gandhi", leaders:"All Congress leaders", end:"Mass arrests by British", info:"Call for immediate British withdrawal from India.", region:"All India", img:"https://via.placeholder.com/400x250?text=Quit+India"},
  {name:"Independence of India", years:"1947", founder:"Indian National Congress & Leaders", leaders:"Mahatma Gandhi, Nehru, Sardar Patel", end:"India became independent", info:"End of British colonial rule.", region:"India", img:"https://via.placeholder.com/400x250?text=Independence+1947"}
];

const container = document.getElementById("timeline");

function showDetails(d) {
  const mapRegion = document.getElementById("mapRegion");
  const infoRegion = document.getElementById("infoRegion");

  mapRegion.innerHTML = `
    <h2>Map/Region</h2>
    <p><strong>Region:</strong> ${d.region}</p>
    <img id="eventMap" src="${d.img}" alt="${d.name} map">
  `;

  infoRegion.innerHTML = `
    <h2>${d.name}</h2>
    <p><strong>Period:</strong> ${d.years}</p>
    <p><strong>Founder/Leaders:</strong> ${d.founder}</p>
    <p><strong>Main Leaders/Participants:</strong> ${d.leaders}</p>
    <p>${d.info}</p>
  `;

  const img = document.getElementById("eventMap");
  setTimeout(() => img.classList.add("visible"), 50);
}

events.forEach(d => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<strong>${d.years}</strong>`;
  card.onclick = () => showDetails(d);
  container.appendChild(card);
});
</script>

</body>
</html>
