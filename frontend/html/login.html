<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bharat Darshan | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}
  <link rel="stylesheet" href="../css/login.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <h1>Bharat Darshan</h1>
      <p class="subtitle">Digital Atlas of Indian History</p>

      <form method="POST">
        {% csrf_token %}
        <label for="email">Email / Student ID</label>
        <input type="text" id="email" name="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>

        <button type="submit">Enter the Atlas</button>

        {% if error %}
          <p style="color:#8b0000; margin-top:10px;">{{ error }}</p>
        {% endif %}
      </form>

      <p class="note">
        Access restricted to registered learners
      </p>
    </div>
  </div>

</body>
</html>
